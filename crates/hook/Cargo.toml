[package]
name = "multicap-hook"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Direct3D 9 graphics hook, injected into a game process to capture frames without a display."

[lib]
crate-type = ["cdylib"]

[dependencies]
multicap-ipc = { path = "../ipc" }
retour = "0.4.0-alpha.4"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D9",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
]

