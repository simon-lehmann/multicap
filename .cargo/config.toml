# Cross-compiling to Windows from Linux (no Microsoft toolchain needed: the `windows`
# crate ships its own import libs, `xwin` supplies the CRT ones, rust-lld links).
#   cargo install xwin && xwin --accept-license splat --output ~/.xwin
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
  "-Lnative=/home/simon/.xwin/crt/lib/x86_64",
  "-Lnative=/home/simon/.xwin/sdk/lib/um/x86_64",
  "-Lnative=/home/simon/.xwin/sdk/lib/ucrt/x86_64",
]
